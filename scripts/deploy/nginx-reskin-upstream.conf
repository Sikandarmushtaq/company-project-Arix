# Single source of truth for which color serves reskin traffic.
# Installed at /etc/nginx/conf.d/nuxcall-reskin-upstream.conf. activate.sh /
# rollback.sh rewrite ONLY this file (server port 3000=blue / 3001=green) and
# `nginx -s reload` to flip. The three vhosts (arixcall, app/admin.arixcall.com,
# sslip) must proxy_pass http://nuxcall_reskin; — never a hardcoded 127.0.0.1:PORT.
upstream nuxcall_reskin { server 127.0.0.1:3001; }
